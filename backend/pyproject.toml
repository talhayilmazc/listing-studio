[project]
name = "etsy-assistant-backend"
version = "0.1.0"
description = "Etsy Listing Assistant backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "arq>=0.26",
    "redis>=5.0",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "cryptography>=43.0",
    "pyvips>=2.2",
    # Floors from pip-audit (quality pass 2026-10): Pillow 12.3 had 35 advisories (it decodes
    # every upload), certifi one (its CA bundle).
    "Pillow>=13.0",
    "certifi>=2026.10.19",
    "anthropic>=0.69",
    "argon2-cffi>=23.1",
    "sentry-sdk>=2.0",
    # Image analysis for mockup templates, on our own CPU (pipeline/mockup_vision.py):
    # LiteRT runs Google's MediaPipe models (Apache-2.0); numpy holds the tensors.
    "ai-edge-litert==2.3.0",
    "numpy==1.26.4",
    # Garments in a template photo (pipeline/garments.py): onnxruntime (MIT) runs the
    # IS-Net saliency model (Apache-2.0); scipy and scikit-image (BSD-3) the geometry.
    "onnxruntime==1.20.1",
    "scipy==1.13.1",
    "scikit-image==0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis[lua]>=2.23",
    "aiosqlite>=0.20",
    "mypy>=1.11",
    "ruff>=0.6",
]
# Evaluating mockup detection on the seller's own photos (evals/mockup_eval.py): reads
# PSD templates. Never in the production image.
eval = [
    "psd-tools[composite]==1.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
