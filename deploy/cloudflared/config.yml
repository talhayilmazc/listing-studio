# Cloudflare Tunnel ingress (production-spec F2). Locally managed, so the rules
# are reviewed in git rather than clicked together in a dashboard.
#
# Replace 363c5d63-6d28-4f51-b9ae-848daab69e05 in both places with the id printed by
# `cloudflared tunnel create listyro` (docs/deploy.md, step 3). The credentials
# JSON lives in /etc/listyro/cloudflared/ on the server, never in this repo.

tunnel: 363c5d63-6d28-4f51-b9ae-848daab69e05
credentials-file: /etc/cloudflared/creds/363c5d63-6d28-4f51-b9ae-848daab69e05.json

ingress:
  # The token-authenticated bootstrap endpoints are never reachable from the
  # internet. Admin work goes through the session-protected /api/admin/* (the
  # /admin screens), which the frontend proxies like any other /api call.
  - hostname: listyro.com
    path: ^/api/account/admin/
    service: http_status:404

  # The API, straight from the edge (page weight and uploads, 2026-10-23): uploads and
  # images do not pass through the Next.js server as well. Same host, so the browser
  # still only talks to listyro.com: the session cookie (host-only), the Origin the
  # CSRF check compares with FRONTEND_URL and cf-connecting-ip are all as before, and
  # no CORS is involved. After the admin rule above, so that refusal still comes first.
  - hostname: listyro.com
    path: ^/api/
    service: http://api:8000

  # The app's pages. In development Next rewrites /api/* to the API (next.config.mjs).
  - hostname: listyro.com
    service: http://frontend:3000

  # api.listyro.com exists for exactly two things: Etsy's OAuth redirect, which
  # must match the callback URL registered with Etsy, and the uptime check.
  # Everything else on this hostname is refused at the edge.
  - hostname: api.listyro.com
    path: ^/api/auth/etsy/callback$
    service: http://api:8000
  - hostname: api.listyro.com
    path: ^/health$
    service: http://api:8000
  - hostname: api.listyro.com
    service: http_status:404

  # Anything else that reaches the tunnel.
  - service: http_status:404
