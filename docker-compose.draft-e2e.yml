# A draft made from a profile typed by hand, in a real browser, against a fake Etsy
# (frontend/e2e/manualDraft.spec.ts starts and stops this stack itself).
#
#   docker compose -p listyro-draft-e2e -f docker-compose.draft-e2e.yml up -d --build --wait
#   docker compose -p listyro-draft-e2e -f docker-compose.draft-e2e.yml down --volumes
#
# The production frontend image on localhost:3821, and one container with the API and the worker.
# "Etsy" is the backend tests' own fake (backend/tests/browser_etsy.py, on tests/test_end_to_end.py's
# FakeEtsy), answering from memory inside that container: backend/scripts/draft_e2e.py gives every HTTP
# client in the process an in-memory transport, so no request of any kind leaves it. ETSY_CALLS_BLOCKED
# stays on, as on every development machine; only the API client's own requests reach the fake.
#
# Self-contained and synthetic: its own Postgres and Redis on tmpfs (no volumes, nothing kept), one
# made-up account with two shops, keys generated at start (no secret in any file, no .env).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: listyro_draft_e2e
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, e2e]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    command: [redis-server, --save, "", --appendonly, "no"]
    # The image declares /data a volume: without this each run leaves an anonymous volume behind.
    tmpfs: [/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 30

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: dev  # the fake Etsy is the backend tests' own (tests/), which need the test tooling
    environment:
      APP_ENV: development
      ETSY_CALLS_BLOCKED: "true"
      ETSY_CLIENT_ID: stub-keystring
      ETSY_CLIENT_SECRET: stub-shared-secret
      DATABASE_URL: postgresql+asyncpg://e2e:e2e@postgres:5432/listyro_draft_e2e
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3821
      CORS_ORIGINS: http://localhost:3821
      SESSION_COOKIE_SECURE: "false"
      STORAGE_DIR: /tmp/e2e-storage
      AUTH_RATE_LIMIT_REQUESTS: "1000"
      LLM_API_KEY: ""
      UPLOAD_RETENTION_APPLY: "false"
    # The API and the worker in one container: they share the keys made here and the storage folder.
    command:
      - sh
      - -c
      - >
        export SECRET_KEY=$$(python -c 'import secrets; print(secrets.token_urlsafe(48))') &&
        export ENCRYPTION_KEY=$$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())') &&
        python scripts/draft_e2e.py setup &&
        (arq scripts.draft_e2e.WorkerSettings &) &&
        exec uvicorn scripts.draft_e2e:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      retries: 90

  frontend:
    # The production image (docker compose -f docker-compose.prod.yml build frontend);
    # it proxies /api to http://api:8000, which is the service above in this project.
    image: listyro/frontend:latest
    ports: ["3821:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      retries: 60
