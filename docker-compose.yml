# Local development. Production is docker-compose.prod.yml (see docs/deploy.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: dev  # test tooling for local work; production installs none
    # Apply migrations before serving so the schema is present on first run.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      STORAGE_DIR: /data/storage
      # Development never calls Etsy: the local database can hold real shops
      # that production already serves, and a local sync, stats read, draft or
      # token refresh for them must not happen (backend/app/etsy/guard.py).
      # Local development always runs with this on; Etsy features are
      # smoke-tested on production, with the test shop only.
      ETSY_CALLS_BLOCKED: "true"
      # Development never deletes uploads by itself: local storage holds real
      # accounts' designs. The daily job only reports what it would delete.
      UPLOAD_RETENTION_APPLY: "false"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The whole backend test suite, one command (CLAUDE.md "Geliştirme notları"):
  #   docker compose run --rm tests                      # everything
  #   docker compose run --rm tests -q tests/test_x.py   # a part of it
  # Some tests read files outside backend/ (deploy scripts, docs, the frontend's
  # copy, .gitignore, git's own index); they are mounted read-only where the tests
  # look for them (the repository root is "/" inside the container). Its own
  # storage folder, never the uploads volume; nothing is sent to Etsy.
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: dev
    entrypoint: ["python", "-m", "pytest", "-p", "no:cacheprovider"]
    command: ["-q"]
    environment:
      # The whole run starts at this moment, for Python and SQLite alike (not file times), so a date worked
      # out at import and "today" in a test are one day: no run crosses midnight UTC (30 tests in 18
      # files failed when one did). It keeps ticking; only monotonic time is left real.
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      FAKETIME: "@2026-11-04 12:00:00"
      FAKETIME_DONT_FAKE_MONOTONIC: "1"
      TZ: UTC
      STORAGE_DIR: /tmp/test-storage
      ETSY_CALLS_BLOCKED: "true"
      UPLOAD_RETENTION_APPLY: "false"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./backend:/backend:ro
      - ./frontend:/frontend:ro
      - ./deploy:/deploy:ro
      - ./docs:/docs:ro
      - ./docker:/docker:ro
      - ./.githooks:/.githooks:ro
      - ./.git:/.git:ro
      - ./.gitignore:/.gitignore:ro
      - ./.env.example:/.env.example:ro
      - ./CLAUDE.md:/CLAUDE.md:ro
      - ./docker-compose.yml:/docker-compose.yml:ro
      - ./docker-compose.prod.yml:/docker-compose.prod.yml:ro
      - ./docker-compose.oauth-e2e.yml:/docker-compose.oauth-e2e.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: dev  # test tooling for local work; production installs none
    command: arq app.workers.settings.WorkerSettings
    environment:
      STORAGE_DIR: /data/storage
      # As for the api above: the local worker sends nothing to Etsy.
      ETSY_CALLS_BLOCKED: "true"
      # Development never deletes uploads by itself: local storage holds real
      # accounts' designs. The daily job only reports what it would delete.
      UPLOAD_RETENTION_APPLY: "false"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    command: npm run dev
    environment:
      # Server-side Next.js proxies /api/* to the backend (avoids browser CORS).
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storage_data:
  frontend_node_modules:
  frontend_next:
