# The 100-account load test: the real API (2 uvicorn workers) and the real arq worker, on
# Postgres and Redis configured as in production, against an Etsy and an AI model answered from
# memory. Run it with backend/scripts/load/run.sh, which also stops it. Details: docs/load-test.md.
#
# Nothing can reach Etsy, three times over: ETSY_CALLS_BLOCKED stays on; the only httpx transport
# inside the app container is the in-memory stub (scripts/load/stub.py), which also keeps token
# refresh and image fetches blocked; and the network is internal, with no route out at all.
#
# Self-contained and synthetic: no volumes, no .env, no real account. Everything lives in the
# containers' own layers and goes with them; keys are generated by run.sh for each run.
# LOAD_CPUSET pins everything but the driver to the CPUs a production VM would have.

x-load-env: &load-env
  APP_ENV: development
  ETSY_CALLS_BLOCKED: "true"
  ETSY_CLIENT_ID: stub-keystring
  ETSY_CLIENT_SECRET: stub-shared-secret
  DATABASE_URL: postgresql+asyncpg://load:load@load-postgres:5432/listyro_load
  REDIS_URL: redis://load-redis:6379/0
  SECRET_KEY: ${LOAD_SECRET_KEY:?run backend/scripts/load/run.sh}
  ENCRYPTION_KEY: ${LOAD_ENCRYPTION_KEY:?run backend/scripts/load/run.sh}
  STORAGE_DIR: /tmp/load-storage
  FRONTEND_URL: http://load-frontend
  CORS_ORIGINS: http://load-frontend
  SESSION_COOKIE_SECURE: "false"
  LLM_API_KEY: stub-not-a-key
  # Every seller here comes from the driver's one IP address; production counts per address.
  RATE_LIMIT_REQUESTS: "100000000"
  AUTH_RATE_LIMIT_REQUESTS: "100000000"
  STORAGE_CAP_GB: "50"
  LOAD_ETSY_MS: ${LOAD_ETSY_MS:-120,350}
  LOAD_MODEL_MS: ${LOAD_MODEL_MS:-6000,16000}
  LOAD_ACCOUNTS: ${LOAD_ACCOUNTS:-100}
  LOAD_SHOPS: ${LOAD_SHOPS:-3}
  LOAD_LISTINGS: ${LOAD_LISTINGS:-500}

services:
  load-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: load
      POSTGRES_PASSWORD: load
      POSTGRES_DB: listyro_load
      PGDATA: /pgdata/data
    # Production's settings (it sets none), with pg_stat_statements for the slowest-queries report.
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, pg_stat_statements.track=all]
    # The image's VOLUME path gets a tmpfs so no anonymous volume is made; data is in PGDATA.
    tmpfs: [/var/lib/postgresql/data]
    cpuset: ${LOAD_CPUSET:-0-1}
    networks: [load]
    healthcheck:
      test: [CMD, pg_isready, -U, load, -d, listyro_load]
      interval: 2s
      retries: 60

  load-redis:
    image: redis:7
    # Production's limits (docker-compose.prod.yml), with its AOF in the container's layer.
    command: [redis-server, --dir, /tmp, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, volatile-lru]
    mem_limit: 384m
    tmpfs: [/data]
    cpuset: ${LOAD_CPUSET:-0-1}
    networks: [load]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 60

  load-setup:
    build: &load-build
      context: .
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: ""
    environment: *load-env
    command: [bash, -c, "alembic upgrade head && python -m scripts.load.seed"]
    volumes:
      - ./backend:/app:ro
    networks: [load]
    depends_on:
      load-postgres: {condition: service_healthy}
      load-redis: {condition: service_healthy}

  load-app:
    # One container for the API and the worker, so they share the storage folder with no volume.
    # The commands are production's, with the app module swapped for the one with the stub.
    build: *load-build
    environment: *load-env
    command:
      - bash
      - -c
      - >-
        mkdir -p /tmp/load-storage &&
        (python -m scripts.load.sampler &
        arq scripts.load.stub.WorkerSettings &
        uvicorn scripts.load.stub:app --host 0.0.0.0 --port 8000 --workers 2 --no-server-header &
        wait -n)
    volumes:
      - ./backend:/app:ro
    cpuset: ${LOAD_CPUSET:-0-1}
    networks: [load]
    depends_on:
      load-setup: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 5s
      retries: 60

  load-driver:
    build: *load-build
    profiles: [driver]
    environment:
      <<: *load-env
      LOAD_API: http://load-app:8000
    # The sellers' side runs on other CPUs, so it does not take the app's.
    cpuset: ${LOAD_DRIVER_CPUSET:-6-11}
    volumes:
      - ./backend:/app:ro
      - ./load-output:/output
    networks: [load]
    depends_on:
      load-app: {condition: service_healthy}

networks:
  load:
    internal: true
