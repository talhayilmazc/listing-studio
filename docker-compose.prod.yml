# Production (production-spec F). Standalone, not an override of
# docker-compose.yml: nothing here inherits the development bind mounts,
# published ports or `--reload`.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# No port is published to the host. The only way in is the Cloudflare Tunnel
# (the `cloudflared` service below), which dials out to Cloudflare; the host
# firewall can therefore stay closed to everything but SSH. See docs/deploy.md.

name: listyro

x-logging: &logging
  # Rotated by size: at most 5 x 10 MB per container. The Privacy Policy says
  # logs are rotated automatically; this is what makes that true.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      EXTRAS: ""  # no test tooling in production images
  image: listyro/backend:latest
  # Overridable only so a rehearsal can use a scratch file; on the server this
  # is /opt/listyro/.env.
  env_file: ${LISTYRO_ENV_FILE:-.env}
  environment:
    STORAGE_DIR: /data/storage
  volumes:
    - storage_data:/data/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7
    # Append-only persistence: the daily Etsy quota counters live here. Losing
    # them on a restart would reset the count mid-day and let the app overrun
    # Etsy's 5,000-request limit. (Sessions persist too, so a restart does not
    # sign everyone out.)
    #
    # It must come back up by itself. A write cut off by a full disk left the
    # append-only file damaged, and Redis refused to start until it was repaired
    # by hand; with Redis down the whole site is down. Redis holds sessions,
    # queues and counters, so losing the last few writes is acceptable and
    # staying down is not. So before starting: a damaged file is cut back to
    # its last good command (what `redis-check-aof --fix` does), and if even
    # that fails it is set aside and Redis starts empty. Either way it says so
    # in its log. `aof-load-truncated yes` covers the plain truncated tail.
    #
    # Memory: capped, and under pressure only keys with an expiry are evicted,
    # least recently used first. That is old sessions and finished job results;
    # the job queue has no expiry and is never evicted, and today's counters are
    # the most recently used keys there are.
    command:
      - sh
      - -c
      - |
        dir=/data/appendonlydir
        manifest="$$dir/appendonly.aof.manifest"
        aside() {
          echo "redis start: $$1; setting the append-only file aside and starting empty (sessions, queued jobs and today's counters are lost)"
          mv "$$dir" "$$dir.broken.$$(date +%s)"
        }
        if [ -f "$$manifest" ] && ! redis-check-aof "$$manifest" >/dev/null 2>&1; then
          echo "redis start: the append-only file is damaged (an interrupted write); cutting it back to the last good command"
          yes | redis-check-aof --fix "$$manifest" >/dev/null 2>&1 || true
          # The repair can report success and leave something the server refuses
          # (it empties a destroyed manifest and calls it valid): look again.
          if [ ! -s "$$manifest" ] || ! redis-check-aof "$$manifest" >/dev/null 2>&1; then
            aside "it could not be repaired"
          fi
        fi
        # Whatever the checker misses: a server that has not stayed up for 30
        # seconds three times running is not going to by itself.
        tries="$$(cat /data/.starts 2>/dev/null || echo 0)"
        if [ "$$tries" -ge 3 ] && [ -d "$$dir" ]; then
          aside "it failed to start $$tries times running"
          tries=0
        fi
        echo $$((tries + 1)) > /data/.starts
        (sleep 30; echo 0 > /data/.starts) &
        exec redis-server --appendonly yes --aof-load-truncated yes --maxmemory 256mb --maxmemory-policy volatile-lru
    mem_limit: 384m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  api:
    <<: *backend
    # Migrations run once, before any worker process starts serving. No --reload.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
        --workers 2 --no-server-header
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    <<: *backend
    command: ["arq", "app.workers.settings.WorkerSettings"]
    healthcheck:
      # arq records a heartbeat in Redis; --check fails if it has gone stale.
      test: ["CMD", "arq", "--check", "app.workers.settings.WorkerSettings"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.prod.Dockerfile
      args:
        API_PROXY_TARGET: http://api:8000
    image: listyro/frontend:latest
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  cloudflared:
    # Pinned: a tunnel client that updates itself underneath production is a
    # change nobody reviewed. Bump deliberately.
    image: cloudflare/cloudflared:2026.9.1
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # The tunnel credentials file lives on the server, never in the repo.
      - /etc/listyro/cloudflared:/etc/cloudflared/creds:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  storage_data:
